spring.application.name=odam

server.port=${PORT:8080}

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:odontologia_odam}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Zona horaria
spring.jackson.time-zone=America/Lima

# Seguridad JWT
odam.jwt.secret=${JWT_SECRET:}
odam.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Errores del servidor
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never