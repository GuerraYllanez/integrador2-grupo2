spring.application.name=odam

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:odontologia_odam}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true

spring.datasource.username=${MYSQLUSER:root}

spring.datasource.password=${MYSQLPASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jackson.time-zone=America/Lima

odam.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes-long}

odam.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always